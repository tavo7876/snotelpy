[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snotelpy"
version = "0.2.2"
description = "SNOTEL API Wrapper for the NRCS RESTful API for quick dataset/dataframe building"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">= 3.9"
authors = [
    {name = "Tate Voeller", email = "tate.voeller@colorado.edu"},
    {name = "Eric Gosnell", email = "eric.gosnell@colorado.edu"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy >= 1.22",
    "matplotlib >= 3.5",
    "requests >= 2.31",
    "pandas >= 2.0",
    "xarray >= 2023.1",
    "pyyaml >= 6.0",
    "geopandas >= 1.0.0",
    "shapely >= 2.0.0",
    "contextily >= 1.7.0",
    "scipy >= 1.10.0"
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[project.urls]
Homepage = "https://tavo7876.github.io/snotelpy/"
Repository = "https://github.com/tavo7876/snotelpy"

[tool.setuptools.packages.find]
where = ["src"]
include = ["snotelpy"]

[tool.setuptools.package-data]
snotelpy = ["ELEMENTS.yaml"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as hitting the real API (deselect with '-m not integration')",
    "slow: marks tests as slow",
]